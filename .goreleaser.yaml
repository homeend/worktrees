# GoReleaser config — runs from .github/workflows/release.yml on every v* tag.
# Builds wt for all platforms, publishes the GitHub Release, and pushes an
# updated binary-install formula to homeend/homebrew-tap.
#
# Note the formula installs the Go binary directly as `wt` — the wt/wt.bin
# wrapper split from build.sh only matters for the side-by-side bin/ layout
# (and Windows cmd.exe shadowing, which brew never hits). cd-on-Enter comes
# from the shell function (`wt shell-init`), which shadows the binary by name
# regardless of how it was installed.
version: 2

project_name: wt

builds:
  - id: wt
    main: .
    binary: wt
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    flags:
      - -trimpath
    ldflags:
      - -s -w

archives:
  - formats: [tar.gz]
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}
    format_overrides:
      - goos: windows
        formats: [zip]
    # The Windows zip ships the cmd.exe wrapper too: there `wt` must be a
    # .cmd so the shell function layering works (see build.sh).
    files:
      - LICENSE
      - README.md
      - src: shell/wt.cmd
        dst: wt.cmd

checksum:
  name_template: checksums.txt

# A re-run of a partially failed release must overwrite the already-uploaded
# assets instead of 422ing.
release:
  replace_existing_artifacts: true

changelog:
  filters:
    exclude:
      - "^docs:"
      - "^test:"

# `brews` is deprecated upstream in favor of homebrew_casks, but casks are
# macOS-only and this formula must keep serving Linux brew users — so we stay
# on `brews` and pin goreleaser to ~> v2.17 in the release workflow.
brews:
  - name: wt
    repository:
      owner: homeend
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
    directory: Formula
    homepage: https://github.com/homeend/worktrees
    description: Fast git worktree manager with lifecycle hooks and cd-on-switch shell integration
    license: MIT
    caveats: |
      For cd-on-Enter in the TUI, add to ~/.zshrc / ~/.bashrc:
        eval "$(wt shell-init zsh)"    # or: shell-init bash
      Use exactly that eval-from-PATH form. Do NOT use
      `wt shell-init --install` with a brew-installed wt: it pins the
      version-numbered Cellar path, which breaks on the next upgrade.
    test: |
      system "#{bin}/wt", "--help"
    commit_author:
      name: goreleaser-bot
      email: code.drill.eu@gmail.com
    commit_msg_template: "Brew formula update for {{ .ProjectName }} version v{{ .Version }}"
